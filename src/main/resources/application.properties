spring.config.import=optional:file:./.env[.properties]
spring.application.name=xunwu-platform
server.port=${PORT:8080}
server.error.include-message=never
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xunwu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:xunwu}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
xunwu.seed-demo=${XUNWU_SEED_DEMO:false}
xunwu.admin-password=${XUNWU_ADMIN_PASSWORD:}
xunwu.demo-password=${XUNWU_DEMO_PASSWORD:}

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.local-cache-scope=STATEMENT
mybatis.configuration.cache-enabled=false
