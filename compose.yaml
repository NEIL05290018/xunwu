# 可选：已有 MySQL 时不需要 Docker。先复制并修改 .env。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?在 .env 设置独立的 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: xunwu
      MYSQL_USER: xunwu
      MYSQL_PASSWORD: ${DB_PASSWORD:?在 .env 设置 DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
